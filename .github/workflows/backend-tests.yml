name: Llink Backend Tests

on:
  push:
    branches:
      - main
      - 'phase-1/**'
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
    paths:
      - 'main.py'
      - 'llink_api/**'
      - 'tests/**'
      - 'docs/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'main.py'
      - 'llink_api/**'
      - 'tests/**'
      - 'docs/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llink-backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API security and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run API tests
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: python -m pytest -q
