name: Llink Interface Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'phase-6/**'
    paths:
      - 'app/**'
      - 'tests/e2e/**'
      - 'build-tools/**'
      - 'scripts/**'
      - 'tailwind.config.cjs'
      - '.github/workflows/interface-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/e2e/**'
      - 'build-tools/**'
      - 'scripts/**'
      - 'tailwind.config.cjs'
      - '.github/workflows/interface-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llink-interface-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Work / Live / Offline UI — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install offline asset build dependencies
        run: npm --prefix build-tools install --no-audit --no-fund
      - name: Prepare local browser libraries (model download skipped for UI tests)
        run: |
          node scripts/prepare-offline-assets.mjs --skip-model
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i scripts/tailwind.input.css -o app/vendor/tailwind.min.css --minify
      - name: Verify locally served frontend dependencies
        run: |
          test -s app/vendor/firebase-runtime.js
          test -s app/vendor/dexie.min.js
          test -s app/vendor/lucide.min.js
          test -s app/vendor/marked.umd.js
          test -s app/vendor/purify.min.js
          test -s app/vendor/tailwind.min.css
      - name: Install Playwright test runner
        working-directory: tests/e2e
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium and Linux dependencies
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Run Llink browser tests
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llink-interface-test-results-${{ github.sha }}
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
