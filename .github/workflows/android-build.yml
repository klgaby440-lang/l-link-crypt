name: Llink Android Build

on:
  push:
    branches:
      - main
      - 'phase-1/**'
    paths:
      - 'app/**'
      - 'capacitor/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llink-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Llink APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capacitor/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm ci

      - name: Verify the selected web application
        working-directory: capacitor
        run: |
          test -f ../app/index.html
          echo "Capacitor webDir points to ../app/index.html"

      - name: Add Android platform when missing
        working-directory: capacitor
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync app/index.html into Android project
        working-directory: capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Llink-Android-debug-${{ github.sha }}
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
